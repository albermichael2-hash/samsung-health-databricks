name: Sync Health Data from Hetzner Nextcloud

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python-Abhängigkeiten installieren
        run: pip install pandas

      - name: Health Connect.zip aus Hetzner Nextcloud laden
        env:
          NC_URL: ${{ secrets.NEXTCLOUD_URL }}
          NC_USER: ${{ secrets.NEXTCLOUD_USER }}
          NC_PASS: ${{ secrets.NEXTCLOUD_PASSWORD }}
        run: |
          mkdir -p raw_export data
          
          # URL-encodierter Pfad wegen des Leerzeichens in "Health Connect.zip"
          FILE_URL="$NC_URL/remote.php/dav/files/$NC_USER/08_Synchronisation/Health%20Connect.zip"
          
          HTTP_CODE=$(curl -s -w "%{http_code}" -u "$NC_USER:$NC_PASS" "$FILE_URL" -o raw_export/export.zip)
          echo "HTTP Status Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Fehler beim Download! Antwort des Servers:"
            cat raw_export/export.zip
            exit 1
          fi
          
          unzip -o raw_export/export.zip -d raw_export/

      - name: Ernährungsdaten extrahieren
        run: python3 scripts/extract.py

      - name: Aktualisierte CSVs ins Repo pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/*.csv
          git commit -m "Automated nutrition data sync" || exit 0
          git push
