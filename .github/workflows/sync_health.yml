      - name: Health Connect.zip aus Hetzner Nextcloud laden
        env:
          NC_URL: ${{ secrets.NEXTCLOUD_URL }}
          SHARE_TOKEN: ${{ secrets.NEXTCLOUD_SHARE_TOKEN }}
          SHARE_PASS: ${{ secrets.NEXTCLOUD_SHARE_PASSWORD }}
        run: |
          mkdir -p raw_export data
          
          # Zugriff über den öffentlichen WebDAV-Endpunkt mit Share-Token & Passwort
          FILE_URL="$NC_URL/public.php/webdav/Health%20Connect.zip"
          
          HTTP_CODE=$(curl -s -w "%{http_code}" -u "$SHARE_TOKEN:$SHARE_PASS" "$FILE_URL" -o raw_export/export.zip)
          echo "HTTP Status Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Fehler beim Download! Antwort des Servers:"
            cat raw_export/export.zip
            exit 1
          fi
          
          unzip -o raw_export/export.zip -d raw_export/
